<title>Ultrahuman Gifting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: Science-page rhythm (quiet white canvas, big rounded photo cards, hairline grids, light-weight headlines)
   with the Gifting-Flow patterns (sticky product header, image-led steps, sheet modals, minimal forms). */
:root{
  --bg:#fff; --ink:#000; --ink-2:rgba(0,0,0,.58); --ink-3:rgba(0,0,0,.38);
  --line:#E8E7E3; --line-2:#D6D6D6; --soft:#F5F5F2; --sheet:#EFEFED; --card:#fff;
  --blue:#112BAF; --blue-2:#1539F5; --navy:#0f1b27; --green:#0B7A4B; --green-bg:#E5F4EC; --red:#C8261B;
  --r:24px; --r-sm:14px; --nav-h:76px; --pill:999px; --gut:clamp(16px,5.5vw,88px);
  --display:'Barlow Condensed','Dharma Gothic E','Arial Narrow',sans-serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
@media(max-width:1000px){:root{--nav-h:64px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- type ---------- */
.eyebrow{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2)}
.eyebrow.on-dark{color:rgba(255,255,255,.7)}
.display{font-family:var(--display);font-style:italic;font-weight:600;text-transform:uppercase;letter-spacing:-.02em;line-height:.88;text-wrap:balance}
.h2{font-size:clamp(34px,4.4vw,60px);font-weight:400;letter-spacing:-.05em;line-height:1.02;text-wrap:balance}
.h2 .g{color:var(--ink-3)}
.h3{font-size:24px;font-weight:400;letter-spacing:-.04em;line-height:1.15}
.lead{font-size:clamp(17px,1.5vw,20px);line-height:1.45;color:var(--ink-2);letter-spacing:-.02em;max-width:520px}
.on-dark .lead,.hero .lead{color:rgba(255,255,255,.76)}
.muted{color:var(--ink-2)}.small{font-size:13px}.mono{font-family:var(--mono);font-size:13px;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 24px;border-radius:var(--pill);font-size:15px;font-weight:450;letter-spacing:-.015em;transition:background .2s,border-color .2s,transform .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-2)}
.btn-white{background:#fff;color:#000}.btn-white:hover{background:#ececec}
.btn-ghost{border:1px solid var(--line-2);background:transparent}.btn-ghost:hover{border-color:#000}
.btn-glass{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(10px)}.btn-glass:hover{background:rgba(255,255,255,.22)}
.btn-dark{background:#000;color:#fff}.btn-dark:hover{background:#222}
.btn-lg{height:54px;padding:0 30px;font-size:16px}
.btn-block{width:100%}
.btn.is-off{background:#E4E3DF;color:rgba(0,0,0,.35);cursor:not-allowed}.btn.is-off:hover{background:#E4E3DF}
.pill-sm{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:var(--pill);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.pill-blue{background:#0A74FF;color:#fff}.pill-dark{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(8px)}
.link{border-bottom:1px solid currentColor;cursor:pointer;font-weight:450}
.iconbtn{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:background .2s}.iconbtn:hover{background:var(--soft)}

/* ---------- header (from UH Landing Page) ---------- */
.announce{text-align:center;font-size:13px;padding:21px 16px;border-bottom:1px solid rgba(0,0,0,.08);letter-spacing:-.01em;line-height:24px}
.announce a{border-bottom:1px solid currentColor;margin-left:6px}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
header.nav.scrolled{border-bottom-color:var(--line)}
.nav-in{height:var(--nav-h);padding:0 40px;margin:0 auto;max-width:1600px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.nav-l{display:flex;align-items:center;gap:32px;min-width:0}
.nav-l a,.nav-l button{font-size:13px;letter-spacing:-.02em;white-space:nowrap;line-height:24px}.nav-l a:hover,.nav-l button:hover{opacity:.55}
.burger{flex:none;width:32px;height:32px;display:grid;place-items:center;margin-right:-4px}
.nav-l .burger:hover{opacity:1}
.nav-r{display:flex;align-items:center;justify-content:flex-end;gap:48px}
.logo{display:inline-flex;align-items:center;gap:8px}
.logo-t{font-weight:800;font-size:17px;letter-spacing:-.04em;font-style:italic;display:inline-flex;align-items:center;gap:7px}
.logo-t i{display:inline-block;width:17px;height:14px;background:currentColor;clip-path:polygon(0 0,38% 0,50% 45%,62% 0,100% 0,62% 100%,38% 100%)}
.logo img{display:block}.logo .lm{width:32px;height:32px}.logo .lw{width:161px;height:14px}
.region{display:flex;align-items:center;gap:6px;position:relative;cursor:pointer;font-family:'JetBrains Mono',var(--mono);font-weight:600;font-size:13px;text-transform:uppercase;line-height:24px}
.region .dot{width:24px;height:24px;border-radius:12px;background:#f1f1f1}
.cart{width:32px;height:32px;flex:none;display:grid;place-items:center}
.btn-pre{height:43px;width:144px;padding:0;background:var(--blue);color:#fff;border-radius:50px;font-size:13px;letter-spacing:-.008em}.btn-pre:hover{background:var(--blue-2)}
.menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.14);padding:8px;z-index:80;min-width:250px;display:none;font-family:var(--sans);text-transform:none;font-weight:400}
.menu.open{display:block}
.menu a,.menu .mi{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-size:14px;text-align:left;font-family:var(--sans);letter-spacing:-.01em}
.menu a:hover,.menu .mi:hover{background:var(--soft)}.menu .mi.on{background:var(--soft);font-weight:500}
.tagnew{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--blue);color:#fff;padding:3px 8px;border-radius:var(--pill)}
.shopw{position:relative}.shopw .menu{top:36px;left:-14px}.region .menu{top:36px;right:-8px}
@media(max-width:1180px){.nav-r{gap:24px}}
@media(max-width:1000px){.nav-in{grid-template-columns:auto 1fr auto;padding:0 20px}.nav-l a,.nav-l .shopw{display:none}.logo{justify-self:center}.logo .lw{width:132px;height:auto}.nav-r{gap:14px}}
@media(max-width:600px){.nav-r .btn-pre{display:none}}

/* ---------- containers ---------- */
.pg{max-width:1600px;margin:0 auto}
.sec{padding:clamp(56px,7vw,104px) var(--gut) 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(32px,4vw,56px)}
.sec-head .h2{margin-top:14px;max-width:820px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:var(--pill);background:var(--soft)}
.seg button{height:38px;padding:0 20px;border-radius:var(--pill);font-size:14px;font-weight:450;color:var(--ink-2);transition:.2s}
.seg button.on{background:#000;color:#fff}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}

/* ---------- hero ---------- */
.hero{position:relative;margin:10px;border-radius:var(--r);overflow:hidden;background:var(--hbg,var(--navy));min-height:clamp(520px,80vh,760px);display:flex;align-items:center;color:#fff;isolation:isolate}
.hero-img{position:absolute;right:-3%;top:-8%;height:116%;width:auto;aspect-ratio:960/972;object-fit:cover;z-index:-1;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%);mask-image:linear-gradient(90deg,transparent 0,#000 34%)}
.hero-in{padding:clamp(28px,5vw,64px) clamp(24px,6vw,96px);max-width:1000px;display:grid;gap:22px;justify-items:start}
.hero h1{font-size:clamp(64px,9.2vw,132px);white-space:nowrap}
.hero .lead{max-width:460px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero-meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:rgba(255,255,255,.7)}
.hero-meta b{display:block;color:#fff;font-weight:450;font-size:15px}
@media(max-width:800px){.hero h1{white-space:normal}.hero{align-items:flex-end;min-height:600px}.hero-img{width:100%;height:66%;right:0;top:0;aspect-ratio:auto;opacity:.62;-webkit-mask-image:linear-gradient(180deg,#000 40%,transparent);mask-image:linear-gradient(180deg,#000 40%,transparent)}.hero h1{font-size:clamp(60px,18vw,96px)}}

/* ---------- photo cards (science "three pillars") ---------- */
.pcard{display:flex;flex-direction:column;gap:20px}
.pimg{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:1/1;background:var(--navy);isolation:isolate}
.pimg>img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
a.pcard:hover .pimg>img{transform:scale(1.04)}
.pimg .ptag{position:absolute;left:16px;top:16px;font-size:12px;font-weight:450;background:rgba(255,255,255,.92);color:#000;padding:6px 12px;border-radius:var(--pill)}
.pcard h3{font-size:24px;font-weight:400;letter-spacing:-.04em;line-height:1.1}
.pcard p{color:var(--ink-2);font-size:15px;max-width:400px;margin-top:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:2px}
.group{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
.group b{font-weight:500;color:#000}
.group .rule{flex:1;height:1px;background:var(--line)}
/* css voucher cards */
.vc{width:230px;aspect-ratio:1.586;border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(135deg,#1539F5,#112BAF 55%,#0A1A75);box-shadow:0 24px 40px rgba(0,0,0,.35);position:relative;overflow:hidden}
.vc::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;border:20px solid rgba(255,255,255,.1)}
.vc .logo-t{font-size:11px}.vc .a{font-family:var(--display);font-style:italic;font-weight:500;font-size:48px;line-height:.85;letter-spacing:-.02em}
.vc .c{font-family:var(--mono);font-size:9px;opacity:.7}
.vc.k{background:linear-gradient(135deg,#34383d,#0c0d0f)}.vc.l{background:linear-gradient(135deg,#f6f4ef,#d8d4ca);color:#000}
.vstack{position:absolute;inset:0;display:grid;place-items:center}
.vstack .vc{position:absolute}
.pimg .vc{width:60%}

/* ---------- hairline grid (science "by the numbers") ---------- */
.hgrid{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hgrid.c3{grid-template-columns:repeat(3,1fr)}.hgrid.c2{grid-template-columns:repeat(2,1fr)}
.hcell{padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:18px;min-height:300px;border-left:1px solid var(--line)}
.hcell:first-child{border-left:0}
.hcell .big{font-size:clamp(40px,4.6vw,64px);font-weight:300;letter-spacing:-.055em;line-height:1}
.hcell .sub{font-size:19px;letter-spacing:-.03em}
.hcell .bul{margin-top:auto;display:flex;gap:10px;font-size:14px;color:var(--ink-2);align-items:flex-start;line-height:1.45}
.hcell .bul::before{content:"";flex:none;width:6px;height:6px;margin-top:7px;background:var(--blue)}
.hcell .vis{border-radius:18px;overflow:hidden;aspect-ratio:16/10;background:var(--navy);margin-bottom:6px;position:relative}
.hcell .vis img{width:100%;height:100%;object-fit:cover}
@media(max-width:900px){.hgrid.c3,.hgrid.c2{grid-template-columns:1fr}.hcell{border-left:0;border-top:1px solid var(--line);min-height:0}.hcell:first-child{border-top:0}}

/* ---------- steps (how it works) ---------- */
.hiw{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,80px);align-items:center}
.hiw-steps{display:grid}
.hs{border-top:1px solid var(--line);padding:22px 0;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:4px 8px;cursor:pointer;opacity:.48;transition:opacity .25s}
.hs:last-child{border-bottom:1px solid var(--line)}
.hs.on,.hs:hover{opacity:1}
.hs .n{font-family:var(--mono);font-size:12px;padding-top:6px}
.hs h4{font-size:22px;font-weight:400;letter-spacing:-.04em;line-height:1.2}
.hs p{grid-column:2;color:var(--ink-2);font-size:15px;max-height:0;overflow:hidden;transition:max-height .35s ease,margin .35s;max-width:420px}
.hs.on p{max-height:120px;margin-top:6px}
.hiw-vis{border-radius:var(--r);overflow:hidden;background:var(--navy);aspect-ratio:790/410;position:relative;isolation:isolate}
.hiw-vis>img{width:100%;height:100%;object-fit:cover;animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
@media(max-width:900px){.hiw{grid-template-columns:1fr}.hiw-vis{order:-1}}
/* css mocks (voucher steps) */
.mock{position:absolute;inset:0;background:radial-gradient(120% 100% at 70% 0%,#25384c 0,#0f1b27 60%);display:grid;place-items:center;padding:24px;animation:fadein .5s ease both}
.mk{background:#fff;color:#000;border-radius:18px;padding:18px;width:min(100%,380px);box-shadow:0 30px 60px rgba(0,0,0,.4);display:grid;gap:10px}
.mk .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.mk .chips{display:flex;gap:6px;flex-wrap:wrap}.mk .chips span{padding:8px 14px;border:1px solid var(--line-2);border-radius:var(--pill);font-size:14px}.mk .chips span.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.mk .cd{font-family:var(--mono);font-size:12px;padding:9px 12px;background:var(--soft);border-radius:10px;display:flex;justify-content:space-between}
.mk .cd em{font-style:normal;color:var(--blue);font-family:var(--sans);font-size:12px}
.mk .msg{font-size:13px;line-height:1.45;color:#333;background:var(--soft);border-radius:12px;padding:12px;font-family:var(--mono);font-size:11px}

/* ---------- rows (occasions / faq) ---------- */
.rows{border-top:1px solid var(--line)}
.row-i{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,5fr) auto;gap:24px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line);transition:padding .25s;cursor:pointer}
.row-i:hover{padding-left:12px}
.row-i h4{font-size:clamp(22px,2.2vw,28px);font-weight:400;letter-spacing:-.045em}
.row-i p{color:var(--ink-2);font-size:16px}
.row-i .go{display:flex;align-items:center;gap:12px}
.row-i .arr{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;transition:.2s}
.row-i:hover .arr{background:var(--blue);color:#fff}
.chip{font-size:12px;font-weight:450;padding:5px 12px;border-radius:var(--pill);background:var(--soft);color:var(--ink-2)}
@media(max-width:800px){.row-i{grid-template-columns:1fr auto;gap:6px 12px}.row-i p{grid-column:1}.row-i .go{grid-row:1/3;grid-column:2}}
.faq{border-top:1px solid var(--line)}
.fq{display:grid;grid-template-columns:5fr 7fr;gap:24px 48px;padding:30px 0;border-bottom:1px solid var(--line)}
.fq h4{font-size:20px;font-weight:400;letter-spacing:-.035em;line-height:1.25}
.fq p{color:var(--ink-2);max-width:620px}
@media(max-width:800px){.fq{grid-template-columns:1fr;gap:8px}}
.faqhead{display:grid;grid-template-columns:5fr 7fr;gap:48px}
@media(max-width:800px){.faqhead{grid-template-columns:1fr;gap:24px}}


/* ---------- structure (Why Ultrahuman pattern) ---------- */
.sh2{text-align:center;max-width:720px;margin:0 auto clamp(28px,3.5vw,48px)}
.sh2 h2{font-size:clamp(30px,3.6vw,48px);font-weight:400;letter-spacing:-.05em;line-height:1.06;text-wrap:balance}
.sh2 p{color:var(--ink-2);font-size:16px;margin-top:12px}
.utabs{display:flex;justify-content:center;margin:0 auto 40px;border-bottom:1px solid var(--line);max-width:560px}
.utabs button{flex:1;padding:14px 8px;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s;white-space:nowrap}
.utabs button:hover{color:#000}.utabs button.on{color:#000;border-bottom-color:#000}
.occg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.oc{padding:24px 26px;border-top:1px solid var(--line);border-left:1px solid var(--line);display:grid;gap:18px;align-content:space-between;min-height:132px;transition:background .2s}
.oc:hover{background:var(--soft)}
.oc:nth-child(-n+3){border-top:0}.oc:nth-child(3n+1){border-left:0}
.oc h4{font-size:19px;font-weight:400;letter-spacing:-.035em;line-height:1.2}
.oc p{font-size:14px;color:var(--ink-2);margin-top:4px}
.oc .t{font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}.oc:hover .t{color:var(--blue)}
@media(max-width:900px){.occg{grid-template-columns:repeat(2,1fr)}.oc{border-left:1px solid var(--line);border-top:1px solid var(--line)}.oc:nth-child(-n+2){border-top:0}.oc:nth-child(odd){border-left:0}.oc:nth-child(n){min-height:0}}
@media(max-width:520px){.occg{grid-template-columns:1fr}.oc{border-left:0!important;border-top:1px solid var(--line)!important}.oc:first-child{border-top:0!important}}
.srow{display:grid;grid-template-columns:repeat(3,1fr);max-width:1180px;margin:0 auto}
.srow.two{grid-template-columns:repeat(2,1fr);max-width:900px}
.srow>div{padding:6px 36px;border-left:1px solid var(--line-2)}.srow>div:first-child{border-left:0;padding-left:0}
.srow h3{font-size:clamp(28px,3vw,40px);font-weight:300;letter-spacing:-.05em;line-height:1.05}
.srow p{color:var(--ink-2);font-size:15px;margin-top:12px;max-width:300px}
@media(max-width:800px){.srow,.srow.two{grid-template-columns:1fr}.srow>div{border-left:0;padding:24px 0;border-top:1px solid var(--line)}.srow>div:first-child{border-top:0;padding-top:0}}
.collage{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:220px 220px;gap:10px;margin-bottom:48px}
.tile{border-radius:var(--r);overflow:hidden;background:var(--navy);position:relative}.tile img{width:100%;height:100%;object-fit:cover}
.tile.big{grid-row:span 2}
@media(max-width:700px){.collage{grid-template-columns:1fr 1fr;grid-template-rows:200px 200px}.tile.big{grid-column:span 2;grid-row:1}}
.acc{max-width:820px;margin:0 auto;border-bottom:1px solid var(--line)}
.acc details{border-top:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;font-size:18px;letter-spacing:-.03em}
.acc summary::-webkit-details-marker{display:none}
.acc summary i{flex:none;width:24px;height:24px;position:relative}
.acc summary i::before,.acc summary i::after{content:"";position:absolute;left:5px;top:11px;width:14px;height:1.5px;background:#000;transition:.2s}
.acc summary i::after{transform:rotate(90deg)}
.acc details[open] summary i::after{transform:rotate(0)}
.acc .a{padding:0 44px 24px 0;color:var(--ink-2);max-width:640px}
.hero.short{min-height:clamp(420px,56vh,520px)}
.hero.short h1{font-size:clamp(56px,7.4vw,104px)}
.center{text-align:center}

/* ---------- motion ---------- */

.rv{opacity:.2;transform:translateY(28px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1);transition-delay:var(--rd,0s)}

.vc::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.45;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:180px}
.vc.k{background:linear-gradient(160deg,#303135,#1a1b1e);box-shadow:0 26px 44px rgba(0,0,0,.3)}
.vc.l{background:linear-gradient(160deg,#ece7dc,#d4cdbd);box-shadow:0 26px 44px rgba(0,0,0,.16)}


/* ---------- tighter image frames ---------- */
.gpanel{padding:10px;gap:0;align-items:stretch}
.gpanel .gtxt{padding:clamp(24px,4vw,64px) clamp(20px,4vw,72px)}
.gpanel .gvis{aspect-ratio:auto;min-height:clamp(380px,40vw,560px);border-radius:16px}
@media(max-width:900px){.gpanel .gvis{min-height:0;aspect-ratio:4/3}.gpanel .gtxt{padding:24px 16px}}
.hcell{padding:10px 10px clamp(20px,2.4vw,32px);gap:16px}
.hcell .vis{margin:0;border-radius:16px;aspect-ratio:4/3}
.hcell .big,.hcell .sub,.hcell .bul{padding:0 clamp(12px,1.6vw,22px)}
.hcell .big{margin-top:6px}
.vis.appvis{background:radial-gradient(120% 90% at 50% 0%,#2b3f58 0,#0f1b27 70%);overflow:hidden;position:relative}
.vis.appvis .phone{position:absolute;left:50%;top:13%;width:min(46%,230px);transform:translateX(-50%);border-radius:30px 30px 0 0;overflow:hidden;border:5px solid #0b0b0d;border-bottom:0;box-shadow:0 30px 70px rgba(0,0,0,.5);background:#fff}
.vis.appvis .phone img{width:100%;height:auto;display:block}

/* ---------- cta + footer ---------- */
.ctab{margin:clamp(72px,9vw,128px) 10px 10px;border-radius:var(--r);background:var(--navy);color:#fff;padding:clamp(40px,7vw,96px) clamp(24px,6vw,96px);display:grid;gap:28px;justify-items:start;position:relative;overflow:hidden;isolation:isolate}
.ctab h2{font-size:clamp(56px,9vw,128px)}
.ctab .glow{position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;background:var(--blue-2);filter:blur(120px);opacity:.55;z-index:-1}
footer.uf{margin:clamp(72px,9vw,128px) 0 0;background:#fafafa;color:#000;font-family:Inter,var(--sans);letter-spacing:-.01em}
.uf-in{max-width:1600px;margin:0 auto;padding:40px clamp(20px,5vw,80px) 0}
.uf-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid rgba(0,0,0,.1)}
.uf-col{padding:44px 28px 40px;border-right:1px solid rgba(0,0,0,.06)}
.uf-col:first-child{padding-left:0}.uf-col:last-child{border-right:0}
.uf h6{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:rgba(0,0,0,.3);margin-bottom:20px}
.uf ul{list-style:none;display:grid;gap:13px}
.uf-col.tall ul{gap:16px}
.uf a,.uf li>span{font-size:13px;color:rgba(0,0,0,.7);letter-spacing:-.012em;line-height:19.5px;display:inline-flex;align-items:center;gap:8px;transition:color .2s}
.uf a:hover{color:#000}
.uf .sub{border-top:1px solid rgba(0,0,0,.05);margin-top:28px;padding-top:21px}
.uf .nw{font-size:8px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:rgba(0,0,0,.1);color:rgba(0,0,0,.7);padding:2px 6px;border-radius:3px;line-height:10px}
.uf .hsa{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(0,0,0,.3);border-radius:8px;padding:8px;margin-top:24px}
.uf-row{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid rgba(0,0,0,.1)}
.uf-row>div{padding:28px 28px 32px;border-right:1px solid rgba(0,0,0,.06)}.uf-row>div:first-child{padding-left:0}.uf-row>div:last-child{border-right:0}
.uf-row h6{font-size:10px;margin-bottom:14px}
.uf-row .lk{display:grid;gap:8px}
.store{display:inline-flex;flex-direction:column;justify-content:center;border:1px solid rgba(0,0,0,.08);border-radius:8px;padding:5px 15px;height:36.5px;line-height:1.2}
.store small{font-size:7px;color:rgba(0,0,0,.7);letter-spacing:0}.store b{font-size:10px;font-weight:500;color:#111}
.uf-copy{padding:34px 0 33px;border-bottom:1px solid rgba(0,0,0,.04);font-size:12px;color:rgba(0,0,0,.3);line-height:17px}
.uf-mark{padding:44px 0 0;overflow:hidden}
.uf-mark img{width:100%;max-width:1280px;margin:0 auto;display:block;height:auto}
@media(max-width:900px){.uf-cols{grid-template-columns:repeat(2,minmax(0,1fr))}.uf-col{border-right:0;padding:32px 20px 24px 0;border-top:1px solid rgba(0,0,0,.06)}.uf-col:nth-child(-n+2){border-top:0}.uf-row{grid-template-columns:1fr}.uf-row>div{padding:24px 0;border-right:0;border-top:1px solid rgba(0,0,0,.06)}.uf-row>div:first-child{border-top:0}}
@media(max-width:520px){.uf-cols{grid-template-columns:1fr}.uf-col:nth-child(2){border-top:1px solid rgba(0,0,0,.06)}}

/* ---------- subnav (sticky product header) ---------- */
.subnav{position:fixed;left:0;right:0;top:calc(var(--nav-h) + env(safe-area-inset-top,0px));z-index:55;background:rgba(250,250,249,.92);backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);border-bottom:1px solid var(--line);transform:translateY(-110%);opacity:0;transition:.3s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.subnav.show{transform:none;opacity:1;pointer-events:auto}
.subnav-in{max-width:1600px;margin:0 auto;padding:10px var(--gut);display:flex;align-items:center;justify-content:space-between;gap:16px}
.pthumb{display:flex;align-items:center;gap:14px;min-width:0}
.pthumb img,.pthumb .tb{width:52px;height:40px;border-radius:8px;object-fit:cover;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.18);background:var(--navy)}
.pthumb b{display:block;font-size:14px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pthumb span{font-size:12px;color:var(--ink-2)}.pthumb s{color:var(--ink-3);margin-right:6px}
@media(max-width:900px){.subnav{display:none}}

/* ---------- builder (configurator) ---------- */
.builder{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:clamp(24px,4vw,64px);align-items:start}
.bstep{padding:0 0 44px}
.bstep+.bstep{border-top:1px solid var(--line);padding-top:44px}
.bhead{display:flex;align-items:baseline;gap:14px;margin-bottom:22px}
.bhead .n{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.bhead h3{font-size:28px;font-weight:400;letter-spacing:-.045em}
.ringpick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rp{border:1px solid var(--line-2);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:14px;text-align:left;transition:.2s;background:#fff}
.rp:hover{border-color:#000}
.rp.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.rp .art{aspect-ratio:16/10;border-radius:12px;background:radial-gradient(100% 120% at 60% 0%,#2a3a4b 0,#0f1b27 70%);display:grid;place-items:center;overflow:hidden;position:relative}
.rp .t{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 4px}
.rp b{font-weight:450;font-size:17px;letter-spacing:-.03em}.rp span{color:var(--ink-2);font-size:15px}
.rp .tk{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--blue);display:none;place-items:center}
.rp.on .tk{display:grid}
.solo{display:flex;align-items:center;gap:16px;padding:14px;border:1px solid var(--line-2);border-radius:20px}
.solo .art{width:120px;aspect-ratio:16/10;border-radius:12px;background:radial-gradient(100% 120% at 60% 0%,#2a3a4b 0,#0f1b27 70%);display:grid;place-items:center;flex:none;overflow:hidden}
.qty{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line-2);border-radius:var(--pill);padding:6px;max-width:440px}
.qty button{width:56px;height:56px;border-radius:50%;background:var(--soft);font-size:26px;font-weight:300;display:grid;place-items:center;transition:.2s}
.qty button:hover{background:#000;color:#fff}
.qty input{flex:1;min-width:0;text-align:center;border:0;outline:0;background:transparent;font-size:44px;font-weight:300;letter-spacing:-.06em;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.qchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.qchips button{height:36px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line-2);font-size:14px;transition:.2s}
.qchips button:hover{border-color:#000}.qchips button.on{background:#000;color:#fff;border-color:#000}
.bbar{display:flex;gap:4px;margin-top:28px;overflow-x:auto;padding-bottom:4px}
.bb{flex:1 1 0;min-width:112px;text-align:left;padding:14px 14px 16px;border-radius:16px;background:var(--soft);display:flex;flex-direction:column;gap:14px;transition:.25s;position:relative}
.bb:hover{background:var(--sheet)}
.bb .r{font-size:12px;color:var(--ink-2)}
.bb .p{font-size:30px;font-weight:300;letter-spacing:-.05em;line-height:1}
.bb .k{font-size:12px;color:var(--ink-2)}
.bb.past{background:#E4E9FF}.bb.on{background:var(--blue);color:#fff}.bb.on .r,.bb.on .k{color:rgba(255,255,255,.78)}
.bnote{margin-top:16px;font-size:15px;color:var(--ink-2);min-height:24px}.bnote b{color:#000;font-weight:450}
.vtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.vtiles{grid-template-columns:repeat(2,1fr)}}
.vt{border:1px solid var(--line-2);border-radius:18px;padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:22px;transition:.2s;background:#fff;min-height:116px}
.vt:hover{border-color:#000}.vt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);background:#F4F6FF}
.vt .v{font-size:32px;font-weight:300;letter-spacing:-.055em;line-height:1}
.vt .h{font-size:12px;color:var(--green);font-weight:500;min-height:16px}
.sumcard{position:sticky;top:136px;background:var(--soft);border-radius:var(--r);padding:28px;display:grid;gap:20px}
.sumtop{display:flex;gap:14px;align-items:center}
.sumtop .tb{width:76px;height:54px;border-radius:10px;overflow:hidden;background:radial-gradient(100% 120% at 60% 0%,#2a3a4b 0,#0f1b27 70%);display:grid;place-items:center;flex:none;position:relative}
.sumtop .tb img{width:100%;height:100%;object-fit:cover}
.sumtop b{display:block;font-weight:450;letter-spacing:-.03em;font-size:17px;line-height:1.2}
.sumtop span{font-size:13px;color:var(--ink-2)}
.sl{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:5px 0}.sl span:first-child{color:var(--ink-2)}
.sl.save span:last-child{color:var(--green);font-weight:500}
.sl.t{border-top:1px solid var(--line-2);margin-top:8px;padding-top:18px;align-items:flex-end}
.sl.t span:first-child{color:#000;font-size:15px}.sl.t span:last-child{font-size:40px;font-weight:300;letter-spacing:-.06em;line-height:1}
.fine{font-size:12px;color:var(--ink-2);line-height:1.5}
.tick{display:flex;gap:10px;font-size:15px;color:var(--ink-2);align-items:flex-start}
@media(max-width:1000px){.builder{grid-template-columns:minmax(0,1fr)}.sumcard{position:static}}
.builder>*{min-width:0}

/* ---------- storytelling steps (detail pages) ---------- */
.story{display:grid;gap:clamp(48px,7vw,96px)}
.st{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(24px,5vw,72px);align-items:center}
.st:nth-child(even){grid-template-columns:minmax(0,4fr) minmax(0,7fr)}.st:nth-child(even) .st-vis{order:2}
.st-vis{border-radius:var(--r);overflow:hidden;aspect-ratio:790/410;background:var(--navy);position:relative}
.st-vis img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.st:hover .st-vis img{transform:scale(1.03)}
.st .n{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.st h3{font-size:clamp(28px,3vw,40px);font-weight:400;letter-spacing:-.05em;margin:10px 0 12px;line-height:1.05}
.st p{color:var(--ink-2);max-width:380px}
@media(max-width:900px){.st,.st:nth-child(even){grid-template-columns:1fr;gap:20px}.st:nth-child(even) .st-vis{order:0}}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}

/* ---------- sheet (modal) ---------- */
.overlay{position:fixed;inset:0;z-index:120;background:rgba(15,27,39,.46);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;padding:clamp(0px,2vw,28px)}
.overlay.open{display:block;animation:ov .25s ease both}
@keyframes ov{from{opacity:0}to{opacity:1}}
.sheet{height:100%;max-width:1480px;margin:0 auto;background:var(--sheet);border-radius:28px;overflow:auto;position:relative;animation:sh .45s cubic-bezier(.2,.8,.2,1) both;overscroll-behavior:contain}
@keyframes sh{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;z-index:5;background:rgba(250,250,249,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:18px clamp(20px,6vw,96px);display:flex;align-items:center;justify-content:space-between;gap:16px}
.sheet-x{position:absolute;right:16px;top:16px;z-index:6;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:16px}
.sheet-x:hover{background:rgba(0,0,0,.16)}
.sheet-head .rt{display:flex;align-items:center;gap:14px;margin-right:44px}
.sheet-body{padding:clamp(32px,5vw,72px) clamp(20px,6vw,96px) 80px}
.sheet-narrow{max-width:640px;margin:0 auto}
.sh-title{text-align:center;font-size:clamp(28px,3.4vw,40px);font-weight:450;letter-spacing:-.05em;line-height:1.1}
.sh-sub{text-align:center;color:var(--ink-2);margin:12px auto 0;max-width:520px}
.sh-step{margin-top:44px}
.sh-step .st-vis{aspect-ratio:790/410}
.sh-step h5{font-size:16px;font-weight:500;letter-spacing:-.02em;margin-top:16px}
.sh-step p{color:#333;margin-top:2px}
.tc{margin-top:64px;padding-top:36px;border-top:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.tc ol{margin:14px 0 0 18px;display:grid;gap:4px}

/* gift wizard */
.gw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:clamp(32px,6vw,96px);align-items:start;max-width:1120px;margin:0 auto}
.gw h2{font-size:clamp(30px,3.4vw,44px);font-weight:450;letter-spacing:-.05em;line-height:1.08}
.gw .sub{color:var(--ink-2);margin:10px 0 28px;max-width:440px}
.prog{display:flex;gap:6px;margin-bottom:28px}.prog i{height:3px;flex:1;border-radius:3px;background:var(--line-2);transition:.3s}.prog i.on{background:var(--blue)}
.stepl{font-size:12px;color:var(--ink-2);margin-bottom:10px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between}
.inp{height:56px;border:1px solid transparent;border-radius:14px;padding:0 18px;outline:0;background:#fff;transition:border-color .15s,box-shadow .15s;width:100%;font-size:16px}
.sheet .inp{background:#fff}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(17,43,175,.1)}
.page-in{border-color:var(--line-2)}
textarea.inp{height:auto;min-height:112px;padding:16px 18px;resize:none;line-height:1.45}
.err{font-size:12px;color:var(--red);display:none}
.field.bad .inp{border-color:var(--red);box-shadow:0 0 0 4px rgba(200,38,27,.08)}.field.bad .err{display:block}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.opt button{background:#fff;border:1px solid var(--line-2);border-radius:16px;padding:16px;text-align:left;display:grid;gap:4px;transition:.2s}
.opt button b{font-weight:450;letter-spacing:-.02em}.opt button span{font-size:13px;color:var(--ink-2)}
.opt button.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.gnav{display:flex;align-items:center;gap:12px;margin-top:26px}
.back{font-size:14px;color:var(--ink-2);padding:0 8px;height:44px}.back:hover{color:#000}
.email{background:#fff;border-radius:22px;padding:12px;box-shadow:0 30px 70px rgba(15,27,39,.14)}
.email .bar{display:flex;gap:6px;padding:4px 6px 12px}.email .bar i{width:9px;height:9px;border-radius:50%;background:#d9d7d1}
.email .bd{border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#2a3a4d 0,#0f1b27 70%);color:#fff;position:relative;min-height:420px;display:flex;flex-direction:column;isolation:isolate}
.email .bd>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:.9}
.email .bd::before{display:none}
.email .in{padding:22px;display:flex;flex-direction:column;flex:1;gap:8px}
.email .to{font-family:var(--sans);font-style:normal;font-weight:400;text-transform:none;font-size:34px;line-height:1.02;letter-spacing:-.05em;margin-top:6px}
.email .msg{font-size:14px;color:rgba(255,255,255,.82);min-height:20px;max-width:90%}
.email .code{margin-top:10px;background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.35);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;backdrop-filter:blur(6px)}
@media(max-width:900px){.gw{grid-template-columns:minmax(0,1fr)}.gw .pv{order:-1;max-width:420px}.email .bd{min-height:300px}.email .to{font-size:40px}}

/* ---------- checkout ---------- */
.ck-wrap{background:var(--sheet);min-height:100vh}
.ck-head{background:rgba(250,250,249,.94);border-bottom:1px solid var(--line);position:sticky;top:calc(var(--nav-h) + env(safe-area-inset-top,0px));z-index:50;backdrop-filter:blur(14px)}
.ck-head .in{max-width:1180px;margin:0 auto;padding:14px var(--gut);display:flex;justify-content:space-between;align-items:center;gap:16px}
.ck{max-width:1180px;margin:0 auto;padding:clamp(32px,5vw,64px) var(--gut) 100px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:clamp(24px,5vw,72px);align-items:start}
.ck h1{font-size:clamp(34px,4vw,52px);font-weight:450;letter-spacing:-.055em;line-height:1;margin-bottom:28px}
.cc{background:#fff;border-radius:22px;padding:24px;margin-bottom:12px}
.cc h3{font-size:18px;font-weight:450;letter-spacing:-.03em;margin-bottom:16px}
.cc .inp{background:var(--soft)}.cc .inp:focus{background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
@media(max-width:900px){.ck{grid-template-columns:minmax(0,1fr)}}
.ck>*,.okgrid>*,.gw>*{min-width:0}
.back-l{font-size:14px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}.back-l:hover{color:#000}

/* ---------- success ---------- */
.ok-hero{margin:10px;border-radius:var(--r);background:var(--navy);color:#fff;padding:clamp(40px,6vw,88px) clamp(24px,6vw,96px);display:grid;gap:22px;justify-items:start;position:relative;overflow:hidden;isolation:isolate}
.ok-hero h1{font-size:clamp(56px,9vw,128px)}
.ok-hero .glow{position:absolute;right:-100px;top:-140px;width:480px;height:480px;border-radius:50%;background:var(--blue-2);filter:blur(120px);opacity:.5;z-index:-1}
.okm{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,1.4,.3,1) both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.codes{border:1px solid var(--line);border-radius:22px;overflow:hidden}
.codes .sc{max-height:360px;overflow:auto}

function giftSheet(){

function gcNext(){
